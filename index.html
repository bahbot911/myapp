<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Моё приложение</title>
    <style>
        body { font-family: sans-serif; max-width: 400px; margin: 50px auto; padding: 20px; }
        input, button { width: 100%; padding: 10px; margin: 5px 0; box-sizing: border-box; }
        button { background: #3b82f6; color: white; border: none; cursor: pointer; }
        #message { margin-top: 10px; color: green; }
    </style>
</head>
<body>
    <h2>Вход</h2>
    <input type="email" id="email" placeholder="Email" required>
    <input type="password" id="password" placeholder="Пароль" required>
    <button onclick="login()">Войти</button>
    <button onclick="signUp()" style="background: #10b981;">Зарегистрироваться</button>
    <p id="message"></p>

    <script type="module">
        // Здесь позже подключим Supabase
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'
        const supabaseUrl = 'https://phpukzhnvugluwnznygk.supabase.co'
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBocHVremhudnVnbHV3bnpueWdrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMyMDEzNDQsImV4cCI6MjEwODc3NzM0NH0.T5KJIbxJNFYI3m7WtdPjP4_0ZUPIEYWsxmj3i6MD3gg'
        const supabase = createClient(supabaseUrl, supabaseKey)

        window.login = async () => {
            const email = document.getElementById('email').value
            const password = document.getElementById('password').value
            const { error } = await supabase.auth.signInWithPassword({ email, password })
            document.getElementById('message').textContent = error ? error.message : 'Вход выполнен!'
        }

        window.signUp = async () => {
            const email = document.getElementById('email').value
            const password = document.getElementById('password').value
            const { error } = await supabase.auth.signUp({ email, password })
            document.getElementById('message').textContent = error ? error.message : 'Проверьте почту для подтверждения'
        }
    </script>
</body>
</html>
